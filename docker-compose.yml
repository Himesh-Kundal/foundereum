services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fnd
      POSTGRES_PASSWORD: fnd
      POSTGRES_DB: foundereum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        CMD: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://fnd:fnd@postgres:5432/foundereum?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        CMD: gateway
    env_file: .env
    environment:
      DATABASE_URL: postgres://fnd:fnd@postgres:5432/foundereum?sslmode=disable
      REDIS_URL: redis://redis:6379
      SUBGRAPH_MCP_URL: http://subgraph-mcp:7000
    ports:
      - "8081:8081"
    depends_on:
      - api
      - subgraph-mcp

  mcp:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        CMD: mcp
    environment:
      PORT_MCP: 8082
      PORT_GATEWAY: 8081
      GATEWAY_URL: http://gateway:8081
    ports:
      - "8082:8082"
    depends_on:
      - gateway

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        CMD: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://fnd:fnd@postgres:5432/foundereum?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  subgraph-mcp:
    build:
      context: ./sidecars/subgraph-mcp
    environment:
      GRAPH_API_KEY: ${GRAPH_API_KEY}
    ports:
      - "7000:7000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api
