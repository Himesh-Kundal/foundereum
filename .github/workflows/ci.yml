name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/foundereum

jobs:
  backend:
    name: Go — Vet, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fnd
          POSTGRES_PASSWORD: fnd
          POSTGRES_DB: foundereum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir internal/db/migrations postgres "postgres://fnd:fnd@localhost:5432/foundereum?sslmode=disable" up

      - name: Run Go Tests
        run: go test -v -race -count=1 ./...
        env:
          DATABASE_URL: postgres://fnd:fnd@localhost:5432/foundereum?sslmode=disable
          REDIS_URL: redis://localhost:6379
          MOCK_CHAINS: "true"

      - name: Build Binaries
        run: make build

  contracts:
    name: Solidity — Forge Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge Build & Test
        run: |
          cd contracts
          forge build --sizes
          forge test -vvv

  frontend:
    name: Frontend — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Typecheck & Build
        run: pnpm build
        working-directory: web

  docker:
    name: Docker — Build & Push Images
    needs: [backend, contracts, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: api, dockerfile: deploy/Dockerfile.app, context: "." }
          - { name: gateway, dockerfile: deploy/Dockerfile.app, context: "." }
          - { name: mcp, dockerfile: deploy/Dockerfile.app, context: "." }
          - { name: worker, dockerfile: deploy/Dockerfile.app, context: "." }
          - { name: web, dockerfile: deploy/Dockerfile.web, context: "." }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: |
            CMD=${{ matrix.service.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
