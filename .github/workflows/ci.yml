name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Backend Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fnd
          POSTGRES_PASSWORD: fnd
          POSTGRES_DB: foundereum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir internal/db/migrations postgres "postgres://fnd:fnd@localhost:5432/foundereum?sslmode=disable" up

      - name: Run Go Tests
        run: go test -v -race ./...
        env:
          DATABASE_URL: postgres://fnd:fnd@localhost:5432/foundereum?sslmode=disable
          REDIS_URL: redis://localhost:6379
          MOCK_CHAINS: "true"

      - name: Build Binaries
        run: make build

  contracts:
    name: Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge Tests
        run: |
          cd contracts
          forge test -vvv

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Typecheck
        run: |
          cd web
          npm run build
