name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "TAG=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/foundereum
            export IMAGE_TAG="${{ steps.tag.outputs.TAG }}"

            # Pull latest compose config
            git fetch origin main
            git reset --hard origin/main

            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Pull new images
            docker compose -f docker-compose.prod.yml pull

            # Run migrations before deploying new code
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="${DATABASE_URL}" \
              api sh -c "
                apk add --no-cache go 2>/dev/null || true
                go install github.com/pressly/goose/v3/cmd/goose@latest 2>/dev/null || true
                goose -dir /src/internal/db/migrations postgres \"\${DATABASE_URL}\" up
              " || echo "Migration runner skipped — run manually if needed"

            # Rolling restart (zero-downtime for stateless services)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health checks
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            # Prune old images
            docker image prune -f

            echo "✅ Deployed tag: ${IMAGE_TAG}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== Service Health ==="
            cd ~/foundereum
            docker compose -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"

            echo ""
            echo "=== API Health Check ==="
            curl -sf http://localhost:8080/healthz || echo "⚠ API not responding"

            echo ""
            echo "=== Gateway Health Check ==="
            curl -sf http://localhost:8081/healthz || echo "⚠ Gateway not responding"
