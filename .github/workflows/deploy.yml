name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "TAG=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            cd ~/foundereum

            # Pull latest compose config
            git fetch origin main
            git reset --hard origin/main

            # Source production environment
            if [ -f .env ]; then
              set -a && source .env && set +a
            fi

            export IMAGE_TAG="${{ steps.tag.outputs.TAG }}"

            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Pull new production images
            docker compose -f docker-compose.prod.yml pull

            # Start DB and cache first
            docker compose -f docker-compose.prod.yml up -d --no-build postgres redis

            # Wait for Postgres to be ready
            echo "Waiting for postgres..."
            until docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U "${POSTGRES_USER:-fnd}" >/dev/null 2>&1; do
              sleep 1
            done

            # Run migrations
            if command -v goose &>/dev/null; then
              echo "Running migrations with goose..."
              goose -dir internal/db/migrations postgres "postgres://${POSTGRES_USER:-fnd}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-foundereum}?sslmode=disable" up
            fi

            # Rolling restart (zero-downtime for stateless services)
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Wait for health checks
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            # Prune old images
            docker image prune -f

            echo "✅ Deployed tag: ${IMAGE_TAG}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== Service Health ==="
            cd ~/foundereum
            docker compose -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"

            echo ""
            echo "=== Caddy Root Health Check ==="
            curl -sf http://localhost/healthz || echo "⚠ Caddy root not responding"

            echo ""
            echo "=== API Health Check ==="
            curl -sf -H "Host: api.foundereum.com" http://localhost/healthz || echo "⚠ API not responding"

            echo ""
            echo "=== Gateway Health Check ==="
            curl -sf -H "Host: gw.foundereum.com" http://localhost/healthz || echo "⚠ Gateway not responding"
